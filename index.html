<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Host</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 15px;
        }

        .card {
            position: relative;
            display: inline-block;
            background: #151a23;
            padding: 20px;
            border-radius: 20px;
            border: 2px solid #0070d1;
            box-shadow: 0 0 25px rgba(0, 112, 209, 0.4);
        }

        .sony-symbols {
            font-size: 20px;
            color: #0070d1;
            margin-bottom: 15px;
            letter-spacing: 8px;
            text-shadow: 0 0 10px #0070d1;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 15px;
            object-fit: cover;
            border: 2px solid #ffffff33;
            display: block;
            margin: 0 auto;
        }

        .goldhen-btn {
            display: block;
            margin-top: 20px;
            padding: 14px 0;
            width: 100%;
            background: linear-gradient(90deg, #ffb703, #fb8500);
            color: #000000;
            text-decoration: none;
            font-size: 22px;
            font-weight: 900;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(251, 133, 0, 0.5);
            letter-spacing: 2px;
        }

        .goldhen-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="sony-symbols">✖ ⭕ 🔺 ⬛</div>
        <img src="FB_IMG_1790699521992.jpg" alt="PS4" class="profile-img">
        <a href="https://raw13g.github.io/" class="goldhen-btn">GoldHEN</a>
    </div>

</body>
</html>
