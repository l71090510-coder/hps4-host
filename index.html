<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 Host</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #0b0e14;
        }

        /* الصورة خلفية لكامل الصفحة */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.5);
            z-index: 1;
        }

        /* المحتوى فوق الصورة */
        .overlay-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        .header-content {
            background: rgba(11, 14, 20, 0.75);
            padding: 15px 25px;
            border-radius: 20px;
            border: 1px solid rgba(0, 112, 209, 0.5);
            box-shadow: 0 0 20px rgba(0, 112, 209, 0.4);
            backdrop-filter: blur(5px);
        }

        .sony-symbols {
            font-size: 22px;
            color: #0070d1;
            letter-spacing: 8px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px #0070d1;
        }

        .user-name {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
            text-shadow: 0 0 8px rgba(0, 112, 209, 0.8);
        }

        .user-phone {
            font-size: 18px;
            color: #25d366;
            direction: ltr;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .goldhen-btn {
            display: block;
            width: 100%;
            max-width: 320px;
            padding: 16px 0;
            background: linear-gradient(90deg, #ffb703, #fb8500);
            color: #000000;
            text-decoration: none;
            font-size: 24px;
            font-weight: 900;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(251, 133, 0, 0.8);
            letter-spacing: 2px;
            transition: transform 0.1s ease;
        }

        .goldhen-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- الصورة تغطي كامل الصفحة -->
    <img src="FB_IMG_1790699521992.jpg" alt="PS4 Background" class="bg-image">

    <!-- البيانات فوق الصورة -->
    <div class="overlay-container">
        <div class="header-content">
            <div class="sony-symbols">✖ ⭕ 🔺 ⬛</div>
            <div class="user-name">أبو علي</div>
            <div class="user-phone">📱 07884447273</div>
        </div>

        <a href="https://raw13g.github.io/" class="goldhen-btn">GoldHEN</a>
    </div>

</body>
</html>
